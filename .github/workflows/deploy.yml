name: Build and publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compile LaTeX sources
        run: |
          docker run --rm -v "$PWD":/w -w /w texlive/texlive:latest bash -c '
            shopt -s nullglob
            for f in notes/*.tex hw/*.tex; do
              echo "--- compiling $f"
              (cd "$(dirname "$f")" && latexmk -pdf -interaction=nonstopmode "$(basename "$f")")
            done'

      - name: Assemble site
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
